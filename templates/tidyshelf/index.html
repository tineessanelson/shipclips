<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo Black"; src: url("assets/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("assets/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #ffd84d; }
      #root { width: 100%; height: 100%; position: relative; font-family: "Inter", sans-serif; color: #1c1a14; background: #ffd84d; }
      .blob { position: absolute; width: 900px; height: 900px; right: -300px; top: -260px; border-radius: 50%; background: #ffc72c; }
      .blob2 { position: absolute; width: 700px; height: 700px; left: -320px; bottom: -220px; border-radius: 50%; background: #ffe17a; }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; }
      .big { font-family: "Archivo Black", sans-serif; font-size: 150px; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase; }
      .line { display: block; overflow: hidden; padding-bottom: 20px; margin-bottom: -12px; }
      .line > span { display: block; }
      .small { font-size: 50px; font-weight: 600; margin-bottom: 30px; }

      .count { font-family: "Archivo Black", sans-serif; font-size: 270px; line-height: 0.95; letter-spacing: -0.05em; }
      .unit { font-family: "Archivo Black", sans-serif; font-size: 120px; text-transform: uppercase; letter-spacing: -0.02em; }
      .barwrap { margin-top: 70px; height: 40px; background: #1c1a14; border-radius: 999px; overflow: hidden; padding: 8px; }
      .barfill { height: 100%; width: 100%; background: #ffd84d; border-radius: 999px; transform-origin: left center; }

      .stat { display: flex; align-items: center; gap: 36px; padding: 38px 0; border-bottom: 5px solid #1c1a14; font-size: 62px; font-weight: 600; letter-spacing: -0.02em; }
      .stat:first-of-type { border-top: 5px solid #1c1a14; }
      .stat i { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #1c1a14; display: block; }

      .pill { align-self: flex-start; margin-top: 70px; background: #1c1a14; color: #ffd84d; font-size: 48px; font-weight: 600; padding: 30px 52px; border-radius: 999px; }
      .foot { position: absolute; left: 90px; bottom: 130px; font-size: 30px; font-weight: 500; color: #5c5232; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div class="blob" id="blob"></div>
      <div class="blob2" id="blob2"></div>

      <div class="scene clip" id="s1" data-start="0" data-duration="3" data-track-index="1">
        <div class="small" id="s1k">One year ago, Tidyshelf had</div>
        <div class="big">
          <span class="line"><span id="s1a">Zero</span></span>
          <span class="line"><span id="s1b">users.</span></span>
        </div>
      </div>

      <div class="scene clip" id="s2" data-start="3" data-duration="4.6" data-track-index="1">
        <div class="small" id="s2k">Today we have</div>
        <div class="count" id="count">0</div>
        <div class="unit" id="unit">people</div>
        <div class="barwrap" id="barwrap"><div class="barfill" id="fill"></div></div>
      </div>

      <div class="scene clip" id="s3" data-start="7.6" data-duration="4.4" data-track-index="1">
        <div class="big" style="font-size: 120px; margin-bottom: 60px;">
          <span class="line"><span id="s3h">How?</span></span>
        </div>
        <div class="stat" id="t1"><i></i>Two people building</div>
        <div class="stat" id="t2"><i></i>Zero ad spend</div>
        <div class="stat" id="t3"><i></i>Every user from a friend</div>
      </div>

      <div class="scene clip" id="s4" data-start="12" data-duration="4" data-track-index="1">
        <div class="big" style="font-size: 170px;">
          <span class="line"><span id="s4a">Thank</span></span>
          <span class="line"><span id="s4b">you.</span></span>
        </div>
        <div class="pill" id="s4p">Next stop: 100,000</div>
        <div class="foot" id="foot">Demo product · made by ShipClips</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out", OUT = "power2.in";
      tl.fromTo("#blob", { x: 0, y: 0, scale: 1 }, { x: -120, y: 140, scale: 1.12, duration: 16, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob2", { x: 0, y: 0 }, { x: 140, y: -100, duration: 16, ease: "sine.inOut" }, 0);

      tl.fromTo("#s1k", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 0.15);
      tl.fromTo(["#s1a", "#s1b"], { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: E, stagger: 0.16 }, 0.45);
      tl.to(["#s1k", "#s1a", "#s1b"], { opacity: 0, y: -30, duration: 0.3, ease: OUT }, 2.65);

      tl.fromTo("#s2k", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 3.05);
      tl.fromTo(["#count", "#unit"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: E, stagger: 0.1 }, 3.2);
      tl.fromTo("#barwrap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.4);
      const counter = { v: 0 };
      const countEl = document.getElementById("count");
      tl.fromTo(counter, { v: 0 }, {
        v: 10000, duration: 2.4, ease: "power2.out",
        onUpdate: () => { countEl.textContent = Math.round(counter.v).toLocaleString("en-US"); }
      }, 3.5);
      tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 1, duration: 2.4, ease: "power2.out" }, 3.5);
      tl.fromTo("#count", { scale: 1 }, { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.9);
      tl.to(["#s2k", "#count", "#unit", "#barwrap"], { opacity: 0, y: -30, duration: 0.3, ease: OUT }, 7.25);

      tl.fromTo("#s3h", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: E }, 7.65);
      tl.fromTo(["#t1", "#t2", "#t3"], { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.45, ease: E, stagger: 0.45 }, 8.2);
      tl.to(["#s3h", "#t1", "#t2", "#t3"], { opacity: 0, y: -30, duration: 0.3, ease: OUT }, 11.65);

      tl.fromTo(["#s4a", "#s4b"], { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: E, stagger: 0.16 }, 12.05);
      tl.fromTo("#s4p", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 12.8);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 13.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
